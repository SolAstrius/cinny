<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aurora</title>
<style>
  html, body { margin: 0; height: 100%; background: #050816; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="kit.js"></script>
<script>
const EVENT = {
  type: 'ink.astrius.room.scene', state_key: '',
  content: { scene: 'aurora', intensity: 80, snow: true, seed: 2611 },
};
const P = Kit.params(EVENT.content);
const W = 384, H = 216, LAKE = 150, BANK = 202;
const g = Kit.canvas(W, H);
const rnd = Kit.mulberry32(P.seed);
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const { px, dither } = Kit;

const C = {
  sky: '#050816', lake: '#060a1a', ripple: '#0b1430',
  far: '#1d2750', farSnow: '#9fcfc8', farSnowSh: '#5d7f94',
  near: '#0b1024', nearSnow: '#3b5468',
  bank: '#0d1428', bankSnow: '#b9c6e2', bankSnowSh: '#6f7fa8', pine: '#050812',
  cabin: '#1a1220', roof: '#2c3a5c', window: '#ffd65c', smoke: '#2a3150',
  star: ['#ece8d6', '#9fb0d8', '#5d6a96'],
};
const AUR = [0xffd8ffb8, 0xffbcd058, 0xff7a8f2f, 0xff555a1d, 0xffb84f7a];  // ABGR: edge, bright, mid, low, violet fringe

// ---- stars
const stars = [];
for (let i = 0; i < 170; i++) stars.push({ x: ri(0, W - 1), y: ri(0, LAKE - 30), c: ri(0, 2), ph: rnd() * 6.3 });

// ---- ridges: midpoint displacement, rendered once
function ridge(base, rough, seedShift) {
  const n = 513, a = new Float32Array(n), r2 = Kit.mulberry32(P.seed + seedShift);
  a[0] = base + (r2() - 0.5) * rough; a[n - 1] = base + (r2() - 0.5) * rough;
  for (let step = n - 1, amp = rough; step > 1; step >>= 1, amp *= 0.55)
    for (let i = step >> 1; i < n; i += step) a[i] = (a[i - (step >> 1)] + a[i + (step >> 1)]) / 2 + (r2() - 0.5) * amp;
  return (x) => a[Math.min(n - 1, Math.max(0, Math.round((x / W) * (n - 1))))];
}
const farR = ridge(108, 66, 1), nearR = ridge(134, 34, 2);
const [land, lg] = Kit.offscreen(W, H);
const [mirror, mg] = Kit.offscreen(W, H);
for (let x = 0; x < W; x++) {
  const ft = Math.round(farR(x)), nt = Math.round(nearR(x));
  const slope = farR(x + 1) - farR(x - 1);
  for (let y = ft; y < LAKE; y++) {
    const depth = y - ft;
    let c = C.far;
    if (depth < 3 + ((x * 7) % 5) && ft < 136) c = slope > 0 ? C.farSnowSh : C.farSnow;
    else if (depth < 12 && ft < 128 && dither(x, y, 0.35)) c = slope > 0 ? C.farSnowSh : C.farSnow;
    lg.fillStyle = c; lg.fillRect(x, y, 1, 1);
  }
  for (let y = nt; y < LAKE; y++) {
    lg.fillStyle = y - nt < 2 && dither(x, y, 0.6) ? C.nearSnow : C.near;
    lg.fillRect(x, y, 1, 1);
  }
  // mirrored, darker, broken every third row
  for (let y = LAKE; y < BANK; y++) {
    const sy = 2 * LAKE - y;
    if ((y - LAKE) % 3 === 2) continue;
    const c = sy >= nt ? '#080d1f' : sy >= ft ? '#10172f' : null;
    if (c) { mg.fillStyle = c; mg.fillRect(x, y, 1, 1); }
  }
}
// near bank with pines and a cabin
const pines = [];
for (let x = -4; x < W; x += ri(5, 14)) pines.push([x, ri(7, 18)]);
function pine(gx, x, base, h) {
  for (let i = 0; i < h; i++) {
    const half = Math.floor(((i % 6) + i / 3) / 2.2);
    gx.fillStyle = C.pine; gx.fillRect(x - half, base - h + i, half * 2 + 1, 1);
    if (i % 6 === 0 && i > 2 && dither(x, base - h + i, 0.7)) { gx.fillStyle = C.bankSnowSh; gx.fillRect(x - half, base - h + i, 2, 1); }
  }
}
for (let x = 0; x < W; x++) {
  const top = BANK + Math.round(Math.sin(x * 0.045) * 3 + Math.sin(x * 0.13) * 1.5);
  for (let y = top; y < H; y++) { lg.fillStyle = y === top ? C.bankSnow : y < top + 3 ? C.bankSnowSh : C.bank; lg.fillRect(x, y, 1, 1); }
}
const CABIN = { x: 236, y: BANK - 10 };
for (const [x, h] of pines) if (Math.abs(x - CABIN.x - 8) > 16) pine(lg, x, BANK + 2, h);
{
  const { x, y } = CABIN;
  lg.fillStyle = C.cabin; lg.fillRect(x, y, 18, 10);
  lg.fillStyle = C.roof; for (let i = 0; i < 6; i++) lg.fillRect(x - 2 + i, y - 1 - i, 22 - i * 2, 1);
  lg.fillStyle = C.bankSnow; for (let i = 0; i < 6; i++) lg.fillRect(x - 2 + i, y - 2 - i, 22 - i * 2, 1);
  lg.fillStyle = C.cabin; lg.fillRect(x + 13, y - 9, 3, 6);  // chimney
  lg.fillStyle = C.window; lg.fillRect(x + 4, y + 3, 3, 3); lg.fillRect(x + 11, y + 3, 3, 3);
}
const CHIMNEY = { x: CABIN.x + 14, y: CABIN.y - 10 };

// ---- aurora curtains, drawn into a pixel buffer each frame
const auroraImg = new ImageData(W, H), abuf = new Uint32Array(auroraImg.data.buffer);
const [aur, ag] = Kit.offscreen(W, H);
const curtains = [0, 1, 2].map((i) => ({
  y: 52 + i * 16 + ri(-6, 6), amp: 10 + rnd() * 10, f1: 0.012 + rnd() * 0.01, f2: 0.04 + rnd() * 0.03,
  ph: rnd() * 6.3, s1: 0.006 + rnd() * 0.006, s2: 0.015 + rnd() * 0.01, len: 34 + ri(0, 20) - i * 6, x0: ri(-60, 40), x1: W - ri(-40, 60),
}));

function drawAurora(t) {
  abuf.fill(0);
  for (const [ci, c] of curtains.entries()) {
    for (let x = Math.max(0, c.x0); x < Math.min(W, c.x1); x++) {
      const edge = Math.min(1, (x - c.x0) / 40, (c.x1 - x) / 40);           // curtains thin out at their ends
      const y0 = Math.round(c.y + Math.sin(x * c.f1 + c.ph + t * c.s1) * c.amp + Math.sin(x * c.f2 + t * c.s2) * 4);
      const strand = 0.55 + 0.45 * Math.sin(x * 0.7 + t * 0.09 + ci * 2.1) * Math.sin(x * 0.23 - t * 0.05);
      const L = Math.round(c.len * P.intensity * (0.55 + 0.45 * Math.sin(x * 0.05 + t * 0.03 + ci)) * edge);
      for (let d = 0; d < L; d++) {
        const y = y0 - d;
        if (y < 0 || y >= LAKE) continue;
        const k = d / Math.max(L, 1);
        if (!dither(x, y, strand * edge * (1 - k * 0.85))) continue;
        abuf[y * W + x] = d === 0 ? AUR[0] : k < 0.25 ? AUR[1] : k < 0.55 ? AUR[2] : k < 0.85 ? AUR[3] : AUR[4];
      }
    }
  }
  ag.putImageData(auroraImg, 0, 0);
}

// reflection: the aurora mirrored into the lake, sparse and broken
const reflImg = new ImageData(W, H), rbuf = new Uint32Array(reflImg.data.buffer);
const [refl, rg] = Kit.offscreen(W, H);
function drawReflection(t) {
  rbuf.fill(0);
  for (let y = LAKE + 1; y < BANK; y++) {
    if ((y - LAKE) % 2) continue;
    // compressed mirror (the curtains hang high, a true mirror would put them below the frame);
    // the sway is slow so the reflection flows rather than flickers
    const sy = Math.round(LAKE - 18 - (y - LAKE) * 3.4), wob = Math.round(Math.sin(t * 0.02 + y * 0.4) * 1.5);
    if (sy < 0) continue;
    for (let x = 0; x < W; x++) {
      const v = abuf[sy * W + Math.min(W - 1, Math.max(0, x + wob))];
      if (v && dither(x, y, 0.55)) rbuf[y * W + x] = v === AUR[0] ? AUR[1] : v === AUR[1] ? AUR[2] : AUR[3];
    }
  }
  rg.putImageData(reflImg, 0, 0);
}

// ---- snow and chimney smoke
const flakes = [];
if (P.snow) for (let i = 0; i < 90; i++) flakes.push({ x: rnd() * W, y: rnd() * H, v: 0.2 + rnd() * 0.35, ph: rnd() * 6.3 });
const smoke = [];

// ---- low clouds over the fjord, lit from above by the curtains: their light level follows how
// strong the aurora is over them, one step at a time so it brightens and dims without popping
const ACLOUD_RAMP = ['#05091a', '#070d1f', '#091124', '#0b1529', '#0e1a2f', '#112035', '#14273b', '#182f42',
  '#1d3a4a', '#244a55', '#2f6062', '#4a8a7c', '#000', '#000', '#000', '#000'];
function auroraStrength(x, t) {
  let s = 0;
  for (const [ci, c] of curtains.entries()) {
    if (x < c.x0 || x > c.x1) continue;
    const edge = Math.min(1, (x - c.x0) / 40, (c.x1 - x) / 40);
    s += (0.55 + 0.45 * Math.sin(x * 0.05 + t * 0.03 + ci)) * edge;
  }
  return s * P.intensity;
}
const aclouds = [];
for (let i = 0; i < 6; i++) {
  const w = ri(70, 150), h = ri(14, 24), y = ri(86, 118), seed = ri(1, 1e9);
  const map = Kit.generateCloudMap(seed, w, h, { layers: 2 });
  const sprites = [0, 1, 2, 3].map((b) => Kit.shadeCloud(map, seed, { v: 0.7, ramp: ACLOUD_RAMP, light: [0, -1], boost: b * 2, glow: false }));
  aclouds.push({ w, h, y, x: ri(-60, W), v: 0.04 + rnd() * 0.05, sprites, level: 0 });
}

let t = 0;
function step() {
  t++;
  for (const c of aclouds) {
    c.x += c.v;
    if (c.x > W + 10) c.x = -c.w - ri(0, 60);
    if (t % 15 === 0) {
      let sum = 0;
      for (let k = 0; k < 6; k++) sum += auroraStrength(c.x + (c.w * k) / 5, t);
      const target = Math.max(0, Math.min(3, Math.round((sum / 6) * 2.6)));
      c.level += Math.sign(target - c.level);
    }
  }
  for (const f of flakes) {
    f.y += f.v; f.x += Math.sin(t * 0.03 + f.ph) * 0.2;
    if (f.y > H) { f.y = -2; f.x = rnd() * W; }
  }
  if (t % 7 === 0) smoke.push({ x: CHIMNEY.x, y: CHIMNEY.y, age: 0 });
  for (let i = smoke.length - 1; i >= 0; i--) {
    const s = smoke[i]; s.age++; s.y -= 0.25; s.x += 0.12 + Math.sin(s.age * 0.1) * 0.1;
    if (s.age > 160) smoke.splice(i, 1);
  }
}

function draw() {
  g.fillStyle = C.sky; g.fillRect(0, 0, W, LAKE);
  for (const s of stars) if (Math.sin(t * 0.05 + s.ph) > -0.6) px(g, s.x, s.y, C.star[s.c]);
  drawAurora(t);
  g.drawImage(aur, 0, 0);
  for (const c of aclouds) g.drawImage(c.sprites[c.level], Math.round(c.x), c.y);
  g.fillStyle = C.lake; g.fillRect(0, LAKE, W, H - LAKE);
  for (let y = LAKE + 3; y < BANK; y += 5) {
    const off = (t * 0.15 + y * 11) % 31;
    g.fillStyle = C.ripple;
    for (let x = -31 + off; x < W; x += 31) g.fillRect(x | 0, y, 12, 1);
  }
  g.drawImage(mirror, 0, 0);
  drawReflection(t);
  g.drawImage(refl, 0, 0);
  g.drawImage(land, 0, 0);
  for (const s of smoke) if (dither(s.x | 0, s.y | 0, 1 - s.age / 160)) {
    g.fillStyle = C.smoke; g.fillRect(s.x | 0, s.y | 0, s.age > 40 ? 2 : 1, 1);
  }
  for (const f of flakes) px(g, f.x, f.y, f.v > 0.4 ? '#e6ecff' : '#8f9cc4');
}
Kit.loop(step, draw);
</script>
</body>
</html>
